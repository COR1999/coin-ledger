name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      # Next.js enforces some rules (route export shapes, server/client
      # boundaries, prerender errors) only at build time. The env schema
      # requires GOOGLE_API_KEY at startup; a placeholder is enough to build,
      # and no real secret is ever needed or exposed in CI.
      - run: npm run build
        env:
          GOOGLE_API_KEY: ci-build-placeholder
          NEXT_TELEMETRY_DISABLED: "1"
